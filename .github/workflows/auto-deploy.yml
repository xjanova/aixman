name: Auto Deploy to Production

on:
  # Deploy after CI completes successfully on main
  workflow_run:
    workflows: ["CI - Build & Quality Checks"]
    types:
      - completed
    branches:
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI checks (fast deploy)'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Required SSH secrets are not configured."
            echo "Please set: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "SSH secrets configured"

      # Never pass a secret through ssh-action's `envs:`. It prepends them to the
      # script as `export KEY='value'` lines and sends the lot as the SSH exec
      # command, so sshd runs `bash -c '<script>'` and the values can be read from
      # ps for the whole deploy, on a server shared with other sites. Plain ssh
      # carries them on stdin, which no command line sees. The deploy script reads
      # this file and deletes it before it does anything else.
      - name: Send secrets to the server over stdin
        timeout-minutes: 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -q -
          printf '%s\0%s\0' "$DATABASE_URL" "$AUTH_SECRET" | ssh -T -p "$SSH_PORT" \
            -o BatchMode=yes -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR \
            "$SSH_USER@$SSH_HOST" 'umask 077 && cat > "$HOME/.aixman-deploy-secrets"'

      - name: Deploy via SSH (git pull + build + pm2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e

            # DATABASE_URL and AUTH_SECRET from the step above. Exported because
            # the build and the first `pm2 start` have always inherited them.
            SECRETS_FILE="$HOME/.aixman-deploy-secrets"
            DATABASE_URL=""
            AUTH_SECRET=""
            if [ -f "$SECRETS_FILE" ]; then
              {
                IFS= read -r -d '' DATABASE_URL || true
                IFS= read -r -d '' AUTH_SECRET || true
              } < "$SECRETS_FILE"
              rm -f "$SECRETS_FILE"
            fi
            export DATABASE_URL AUTH_SECRET

            # Configuration
            DEPLOY_PATH="/home/admin/domains/ai.xman4289.com"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "Starting deployment to ${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            # Backup .env
            cp .env .env.backup.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true

            # Pull latest code
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env exists with required variables
            if [ ! -f .env ]; then
              echo "Creating .env from template..."
              cp .env.example .env 2>/dev/null || touch .env
            fi

            # Set/update critical env vars (idempotent)
            grep -q '^NEXTAUTH_URL=' .env && sed -i 's|^NEXTAUTH_URL=.*|NEXTAUTH_URL=https://ai.xman4289.com|' .env || echo 'NEXTAUTH_URL=https://ai.xman4289.com' >> .env
            grep -q '^NEXT_PUBLIC_APP_URL=' .env && sed -i 's|^NEXT_PUBLIC_APP_URL=.*|NEXT_PUBLIC_APP_URL=https://ai.xman4289.com|' .env || echo 'NEXT_PUBLIC_APP_URL=https://ai.xman4289.com' >> .env
            grep -q '^AUTH_TRUST_HOST=' .env || echo 'AUTH_TRUST_HOST=true' >> .env

            # Replace KEY=... in .env, or append it. Shell builtins only: a value in
            # a `sed` expression is on sed's command line, where ps shows it too.
            set_env_secret() (
              umask 077
              found=""
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  "$1="*) printf '%s=%s\n' "$1" "$2"; found=1 ;;
                  *) printf '%s\n' "$line" ;;
                esac
              done < .env > .env.tmp
              [ -n "$found" ] || printf '%s=%s\n' "$1" "$2" >> .env.tmp
              mv .env.tmp .env
            )

            # Set AUTH_SECRET from GitHub secret
            if [ -n "$AUTH_SECRET" ]; then
              set_env_secret AUTH_SECRET "$AUTH_SECRET"
              set_env_secret NEXTAUTH_SECRET "$AUTH_SECRET"
            fi

            # Set DATABASE_URL from GitHub secret or derive from xmanstudio .env
            if [ -n "$DATABASE_URL" ]; then
              set_env_secret DATABASE_URL "$DATABASE_URL"
            elif ! grep -q '^DATABASE_URL=' .env; then
              # Read DB credentials from xmanstudio's .env (same server, shared DB)
              XMAN_ENV="/home/admin/domains/xman4289.com/.env"
              if [ -f "$XMAN_ENV" ]; then
                DB_HOST=$(grep '^DB_HOST=' "$XMAN_ENV" | cut -d= -f2)
                DB_PORT=$(grep '^DB_PORT=' "$XMAN_ENV" | cut -d= -f2)
                DB_DATABASE=$(grep '^DB_DATABASE=' "$XMAN_ENV" | cut -d= -f2)
                DB_USERNAME=$(grep '^DB_USERNAME=' "$XMAN_ENV" | cut -d= -f2)
                DB_PASSWORD=$(grep '^DB_PASSWORD=' "$XMAN_ENV" | cut -d= -f2)
                echo "DATABASE_URL=mysql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST:-127.0.0.1}:${DB_PORT:-3306}/${DB_DATABASE:-xmanstudio}" >> .env
                echo "Derived DATABASE_URL from xmanstudio config"
              fi
            fi

            # .env and every backup of it hold the DB password, AUTH_SECRET and
            # the R2 keys. cp and the template path create them group-readable;
            # only the deploy user (who also runs PM2) needs them.
            chmod 600 .env .env.backup.* 2>/dev/null || true

            # Install dependencies
            echo "Installing dependencies..."
            npm ci 2>&1 || {
              echo "npm ci failed, trying npm install"
              npm install --production
            }

            # Generate Prisma client
            echo "Generating Prisma client..."
            npx prisma generate

            # Apply manual SQL migrations for ai_ tables (idempotent).
            # NEVER run `prisma db push` here: schema.prisma maps shared Laravel-owned
            # tables (wallets, wallet_transactions) and db push would try to ALTER them.
            echo "Applying manual DB migrations (ai_ tables only)..."
            MIG_URL=$(grep -E '^DATABASE_URL=' .env | head -1 | sed -E 's/^DATABASE_URL=//; s/^"//; s/"$//')
            if [ -n "$MIG_URL" ] && command -v mysql >/dev/null 2>&1; then
              MU=$(echo "$MIG_URL" | sed -E 's#mysql://([^:]+):.*#\1#')
              MP=$(echo "$MIG_URL" | sed -E 's#mysql://[^:]+:([^@]+)@.*#\1#')
              MH=$(echo "$MIG_URL" | sed -E 's#.*@([^:/]+).*#\1#')
              MD=$(echo "$MIG_URL" | sed -E 's#.*/([^?]+).*#\1#')
              for f in $(ls db/migrations/*.sql 2>/dev/null | sort); do
                echo "  applying $f"
                MYSQL_PWD="$MP" mysql -u"$MU" -h"$MH" "$MD" < "$f" 2>&1 | grep -v "Using a password" \
                  || echo "  ($f: warning, non-fatal — migrations are idempotent)"
              done
            else
              echo "  mysql/DATABASE_URL unavailable — apply db/migrations/*.sql manually"
            fi

            # Build production
            echo "Building production..."
            npm run build

            # Let orders a restart would lose finish first (/api/cron/in-flight):
            # a restart cut a customer's paid clip off mid-render on 2026-10-29.
            # KIE and fal jobs are collected after a restart and are not waited
            # for. Three minutes at most, then restart anyway; an app without
            # the endpoint (or not answering) is restarted at once.
            # The secret is required even here (`next start` fills in
            # X-Forwarded-For, so a local request looks proxied and gets 401), and
            # it reaches curl on stdin to stay off curl's command line.
            CRON_SECRET_VALUE=$(grep -E '^CRON_SECRET=' .env | head -1 | cut -d= -f2- | sed -E 's/^"//; s/"$//')
            for i in $(seq 1 18); do
              LEFT=$(printf 'Authorization: Bearer %s\n' "$CRON_SECRET_VALUE" | curl -s --max-time 5 -H @- http://127.0.0.1:3001/api/cron/in-flight | sed -nE 's/.*"unrecoverable":([0-9]+).*/\1/p')
              if [ -z "$LEFT" ]; then echo "In-flight check unavailable — restarting now"; break; fi
              if [ "$LEFT" = "0" ]; then echo "No running order would be lost — restarting"; break; fi
              echo "Waiting for ${LEFT} running order(s) to finish before restart ($i/18)"
              sleep 10
            done

            # Restart with PM2
            echo "Restarting application..."
            if pm2 describe aixman > /dev/null 2>&1; then
              pm2 restart aixman
            else
              pm2 start node_modules/.bin/next --name "aixman" -- start -p 3001
            fi

            # Save PM2 process list
            pm2 save

            # Wait for startup
            sleep 3

            # Health check
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "Application is running"
            else
              echo "Warning: Local health check failed (may need more time)"
              pm2 logs aixman --lines 20 --nostream || true
            fi

            echo "Deployment completed successfully!"

      # The deploy script deletes the file as it starts. This is for a run that
      # stopped before the script got that far.
      - name: Remove secrets file from the server
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: rm -f "$HOME/.aixman-deploy-secrets"

      - name: Health Check
        run: |
          echo "Checking health at: https://ai.xman4289.com"
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://ai.xman4289.com" || echo "000")
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 308 ] || [ "$HTTP_CODE" -eq 301 ]; then
            echo "Application is healthy (HTTP $HTTP_CODE)"
          else
            echo "Health check returned HTTP $HTTP_CODE (may still be starting up)"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "**Status:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**URL:** https://ai.xman4289.com" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
